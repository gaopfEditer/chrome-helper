<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回复审核</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 回复审核</h1>
      <div class="header-actions">
        <button id="fetchPosts" class="btn btn-primary">🔄 获取帖子</button>
        <button id="generateReplies" class="btn btn-primary">✨ 生成回复</button>
        <button id="openOptions" class="btn btn-secondary">⚙️ 设置</button>
      </div>
    </header>

    <div id="fetchLog" class="fetch-log" aria-live="polite"></div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="totalPosts">0</div>
        <div class="stat-label">获取的帖子</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="approvedCount">0</div>
        <div class="stat-label">已批准</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="skippedCount">0</div>
        <div class="stat-label">已跳过</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="pendingCount">0</div>
        <div class="stat-label">待审核</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <select id="platformFilter">
          <option value="all">所有平台</option>
          <option value="binance">币安广场</option>
          <option value="okx">OKX</option>
          <option value="gate">Gate</option>
        </select>
        <select id="statusFilter">
          <option value="pending">待审核</option>
          <option value="approved">已批准</option>
          <option value="skipped">已跳过</option>
          <option value="all">全部</option>
        </select>
      </div>
      <div class="bulk-actions">
        <button id="bulkApprove" class="btn btn-success">✅ 批量批准</button>
        <button id="bulkSkip" class="btn btn-warning">⏭️ 批量跳过</button>
        <button id="startSending" class="btn btn-primary">🚀 开始发送</button>
      </div>
    </div>

    <div id="tasksList" class="tasks-list"></div>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon">📭</div>
      <h2>暂无帖子</h2>
      <p>点击"获取帖子"开始，或手动添加帖子 URL</p>
      <div class="manual-add">
        <input type="text" id="manualPostUrl" placeholder="输入帖子 URL">
        <button id="addManualPost" class="btn btn-secondary">添加</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">编辑回复</h2>
        <button id="closeModal" class="close-btn">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button id="modalSave" class="btn btn-primary">保存</button>
        <button id="modalCancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <div id="progressModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🚀 发送进度</h2>
      </div>
      <div class="modal-body">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="progressText" class="progress-text">0 / 0</div>
        <div id="progressLog" class="progress-log"></div>
      </div>
      <div class="modal-footer">
        <button id="pauseSending" class="btn btn-warning">⏸️ 暂停</button>
        <button id="stopSending" class="btn btn-danger">⏹️ 停止</button>
      </div>
    </div>
  </div>

  <script src="review.js"></script>
</body>
</html>
